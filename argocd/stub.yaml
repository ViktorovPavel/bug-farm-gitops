apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stub
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/ViktorovPavel/bug-farm-gitops.git'
    targetRevision: HEAD
    path: k8s/stub  # <-- Просто подтягивает всю папку k8s/stub!
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: stub
  syncPolicy:
    automated:
      prune: true
      selfHeal: true