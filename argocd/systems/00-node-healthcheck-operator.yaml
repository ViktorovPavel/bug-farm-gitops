apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-healthcheck-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: medik8s-system
  sources:
    # 1. Поправленный URL Helm-репозитория Medik8s
    - repoURL: 'https://medik8s.github.io'
      chart: node-healthcheck-operator
      targetRevision: 0.9.0
      helm:
        values: |
          selfNodeRemediation:
            enabled: true

    # 2. Твои манифесты из Git
    - repoURL: 'https://github.com/ViktorovPavel/bug-farm-gitops.git'
      path: k8s/systems/node-healthcheck-operator
      targetRevision: HEAD
      directory:
        recurse: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true