apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-healthcheck-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: medik8s-system
  sources:
    - repoURL: 'https://github.com/medik8s/self-node-remediation.git'
      path: config/default
      targetRevision: v0.13.0

    - repoURL: 'https://github.com/medik8s/node-healthcheck-operator.git'
      path: config/default
      targetRevision: v0.12.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-healthcheck-configs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1" # Накатывается ПОСЛЕ волны 0
spec:
  project: default
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: medik8s-system
  sources:
    - repoURL: 'https://github.com/ViktorovPavel/bug-farm-gitops.git'
      path: k8s/systems/node-healthcheck-operator
      targetRevision: HEAD
      directory:
        recurse: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true # Игнорирует отсутствие CRD при первоначальном DryRun