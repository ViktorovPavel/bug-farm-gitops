apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
spec:
  project: default
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: envoy-gateway-system
  sources:
    # Источник 1: Helm-чарт Envoy Gateway
    - repoURL: 'oci://docker.io/envoyproxy/gateway-helm'
      chart: gateway-helm
      targetRevision: v1.6.7
      helm:
        # Патчи для отключения автоматического создания Gateway и GatewayClass
        parameters:
          - name: config.skipCreateGatewayClass
            value: "true"
          - name: config.skipCreateGateway
            value: "true"
          # Дополнительный патч: гарантируем, что контроллер не создает свой Service
          - name: config.envoyGateway.provider.type
            value: "Kubernetes"

    # Источник 2: Ваши кастомные манифесты (EnvoyProxy, Gateway, Service)
    - repoURL: 'https://github.com/ViktorovPavel/bug-farm-gitops.git'
      targetRevision: HEAD
      path: k8s/systems/envoy-gateway

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true