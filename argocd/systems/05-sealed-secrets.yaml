apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    # Отрицательный sync-wave, чтобы контроллер поднялся РАНЬШЕ всех остальных приложений
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    # Актуальный Helm-репозиторий Bitnami
    repoURL: 'https://bitnami.github.io/sealed-secrets'
    chart: sealed-secrets
    targetRevision: 2.17.0 # Проверь актуальную версию чарта
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true