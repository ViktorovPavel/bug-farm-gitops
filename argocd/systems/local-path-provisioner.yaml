apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-path-provisioner
  namespace: argocd
spec:
  project: default
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: local-path-storage
  sources:
    # Основной чарт
    - repoURL: 'https://github.com/rancher/local-path-provisioner'
      path: deploy/chart
      targetRevision: HEAD
      helm:
        valueFiles:
          - '$values/helm/local-path-provisioner/values.yaml'
    # Репозиторий с values-файлами
    - repoURL: 'https://github.com/ViktorovPavel/bug-farm-gitops.git'
      targetRevision: HEAD
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true