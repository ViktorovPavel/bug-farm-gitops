apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openebs
  namespace: argocd
spec:
  project: default
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: openebs
  sources:
    # 1. Забор OCI-чарта напрямую из GitHub Packages
    - repoURL: 'oci://ghcr.io/openebs/charts/openebs'
      chart: openebs
      targetRevision: 4.1.1
      helm:
        valueFiles:
          - '$values/helm/systems/openebs/values.yaml'

    # 2. Ссылка на ваш репозиторий с values.yaml
    - repoURL: 'https://github.com/ViktorovPavel/bug-farm-gitops.git'
      targetRevision: HEAD
      ref: values

    # 3. Наш манифест StorageClass из Git
    - repoURL: 'https://github.com/ViktorovPavel/bug-farm-gitops.git'
      targetRevision: HEAD
      path: k8s/systems/openebs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true