apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openebs
  namespace: argocd
spec:
  project: default
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: openebs
  sources:
    # 1. Используем чистый чарт openebs-localpv
    - repoURL: 'https://openebs.github.io/charts'
      chart: openebs-localpv
      targetRevision: 3.10.0
      helm:
        valueFiles:
          - '$values/helm/systems/openebs/values.yaml'

    # 2. Ссылка на репозиторий с values.yaml
    - repoURL: 'https://github.com/ViktorovPavel/bug-farm-gitops.git'
      targetRevision: HEAD
      ref: values

    # 3. Манифест StorageClass из Git
    - repoURL: 'https://github.com/ViktorovPavel/bug-farm-gitops.git'
      targetRevision: HEAD
      path: k8s/systems/openebs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true