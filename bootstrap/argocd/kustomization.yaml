apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

# Подтягиваем официальные манифесты ArgoCD v2.10.0 (можно обновить версию при желании)
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v2.10.0/manifests/ha/install.yaml

# Зона для твоих будущих кастомизаций (например, включение Server-Side Apply, настройка OIDC или Ingress)
patches: []