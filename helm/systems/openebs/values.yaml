# ============================================
# PRE-UPGRADE HOOK - ОТКЛЮЧАЕМ ПОЛНОСТЬЮ
# ============================================
preUpgradeHook:
  enabled: false

# ============================================
# LOCALPV PROVISIONER ДЛЯ TALOS
# ============================================
localpv-provisioner:
  enabled: true

  hostpath:
    enabled: true
    basePath: "/var/local/openebs"
    # Для Talos важно использовать правильные mount options
    mountOptions:
      - bind
      - rshared
      - rw

  helper:
    enabled: true
    baseDir: "/var/local/openebs"

  # Важно для Talos - используем правильные образы
  image:
    repository: openebs/provisioner-localpv
    tag: 4.0.0
    pullPolicy: IfNotPresent

  # Настройки безопасности для Talos
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    privileged: true

  # Ресурсы
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Node selector для Talos
  nodeSelector:
    kubernetes.io/os: linux

  # Tolerations для Talos
  tolerations:
    - operator: Exists

# ============================================
# ОТКЛЮЧАЕМ ВСЕ НЕНУЖНОЕ
# ============================================
engines:
  local:
    lvm:
      enabled: false
    zfs:
      enabled: false
  replicated:
    mayastor:
      enabled: false
    jiva:
      enabled: false

analytics:
  enabled: false

ndm:
  enabled: false