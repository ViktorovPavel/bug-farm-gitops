# Настройка пути для хранения данных томов
localpv:
  basePath: "/var/local/openebs"

# Настройка вспомогательного контейнера (helper)
helper:
  baseDir: "/var/local/openebs"

# Отключаем дефолтный StorageClass от Helm (так как у нас свой sc.yaml в Git)
storageClass:
  create: false

analytics:
  enabled: false