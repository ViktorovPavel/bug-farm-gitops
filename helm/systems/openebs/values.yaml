# Отключаем ненужные тяжелые движки
engines:
  local:
    lvm:
      enabled: false
    zfs:
      enabled: false
  replicated:
    mayastor:
      enabled: false

# Настройки для LocalPV (в 4.x используем ключ openebs-localpv)
openebs-localpv:
  enabled: true

  # Отключаем дефолтные SC из Helm, так как применяем свой манифест из k8s/systems/openebs
  localpv:
    enabled: true
    basePath: "/var/local/openebs"
    # Отключаем встроенное создание SC
    storageClass:
      create: false

  # Путь для вспомогательного контейнера helper
  helper:
    baseDir: "/var/local/openebs"

# Отключаем хуки обновления (убираем ошибку ImagePullBackOff с bitnami/kubectl)
preUpgradeHook:
  enabled: false

analytics:
  enabled: false