# Отключаем ненужные тяжелые движки storage
engines:
  replicated:
    mayastor:
      enabled: false
  local:
    lvm:
      enabled: false
    zfs:
      enabled: false

# Включаем только Dynamic LocalPV Hostpath
localpv-provisioner:
  enabled: true
  localpv:
    basePath: "/var/local/openebs"
  helper:
    baseDir: "/var/local/openebs"

# Отключаем телеметрию
analytics:
  enabled: false