apiVersion: apps/v1
kind: Deployment
metadata:
  name: stub-app
  namespace: stub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stub-app
  template:
    metadata:
      labels:
        app: stub-app
    spec:
      containers:
        - name: http-echo
          image: hashicorp/http-echo:latest
          args:
            - "-listen=:5678"
            - '-text=<!DOCTYPE html><html><head><title>404 Bug Farm</title><style>body{font-family:sans-serif;background:#1a2a1a;color:#e8f0e8;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}.card{background:#2d4a2d;padding:2.5rem;border-radius:20px;box-shadow:0 10px 25px rgba(0,0,0,0.7);text-align:center;border:2px solid #6b8f6b;max-width:500px;}.bug-icon{font-size:4rem;margin-bottom:0.5rem;}.bug-icon span{display:inline-block;animation:wiggle 2s infinite;}.bug-icon span:nth-child(2){animation-delay:0.3s;}.bug-icon span:nth-child(3){animation-delay:0.6s;}@keyframes wiggle{0%,100%{transform:rotate(0deg);}25%{transform:rotate(10deg);}75%{transform:rotate(-10deg);}}h1{color:#ffb347;font-size:3rem;margin:0.5rem 0;letter-spacing:2px;}h1 small{font-size:1.2rem;color:#a8c8a8;display:block;margin-top:-0.2rem;}.subtitle{font-size:1.1rem;color:#b0d0b0;margin:0.5rem 0 1rem;}.divider{width:60px;height:3px;background:#6b8f6b;margin:1rem auto;border-radius:2px;}.message{color:#c8e0c8;font-size:1rem;line-height:1.5;margin:0.5rem 0;}.bug-list{text-align:left;display:inline-block;margin:0.5rem auto;padding:0;list-style:none;}.bug-list li{padding:4px 0;color:#d4e8d4;}.bug-list li::before{content:"🐛 ";}.footer{margin-top:1.5rem;font-size:0.85rem;color:#7a9a7a;border-top:1px solid #3d5a3d;padding-top:1rem;}</style></head><body><div class="card"><div class="bug-icon"><span>🐞</span><span>🐜</span><span>🪲</span></div><h1>404 <small>Bug Farm</small></h1><div class="subtitle">🌾 The page you seeded didn''t grow 🌾</div><div class="divider"></div><p class="message">Oops! This path is either:</p><ul class="bug-list"><li>Undiscovered in our fields</li><li>Eaten by hungry beetles</li><li>Still pupating — check back later</li></ul><div class="footer">🐝 Welcome to the Bug Farm — every bug is a feature here!</div></div></body></html>'
          ports:
            - containerPort: 5678
          resources:
            limits:
              cpu: 10m
              memory: 16Mi
            requests:
              cpu: 5m
              memory: 8Mi